<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forget Fleet · weeks-long memory for an always-on Muse Glimmer agent</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0a0c11;--panel:#11141b;--panel2:#161a23;--line:#222837;--text:#e9ecf3;--dim:#8a93a8;
        --blue:#4c8dff;--green:#35c58a;--red:#ff5d6c;--amber:#f2b84b;--violet:#a88bff;--teal:#38c7d0}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);height:64px}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--violet));display:grid;place-items:center;font-weight:800}
  h1{font-size:17px;margin:0;font-weight:650} .sub{color:var(--dim);font-size:13px}
  .badges{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .badge{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--dim);background:var(--panel)}
  .badge b{color:var(--text);font-weight:600} .badge.local b{color:var(--teal)} .badge.cloud b{color:var(--violet)}
  main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;padding:16px 24px;height:calc(100% - 64px)}
  .col{min-height:0;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .card h2{margin:0 0 8px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);font-weight:600;display:flex;gap:8px;align-items:center}
  .dayhead{display:flex;align-items:baseline;gap:12px}
  .dayhead .d{font-size:26px;font-weight:700;letter-spacing:-.3px} .dayhead .n{color:var(--dim)}
  .map{display:grid;grid-template-columns:repeat(23,1fr);gap:4px;margin-top:6px}
  .row2{grid-column:1 / span 23;display:grid;grid-template-columns:repeat(23,1fr);gap:4px}
  .tile{height:38px;border-radius:7px;background:#1a1f2a;border:1px solid #232a38;display:flex;flex-direction:column;align-items:center;justify-content:center;
        font-size:9.5px;color:#7d869b;position:relative;transition:all .35s}
  .tile .c{font-size:9px;font-weight:700;color:var(--violet)}
  .tile.tev{background:#2a2412;border-color:#5b4a1d;color:#f3d48f}
  .tile.mem{box-shadow:inset 0 -3px 0 var(--violet)}
  .tile.alert{background:#3a1419;border-color:#a53441;color:#ffd3d8;animation:pulse 1.4s infinite}
  .tile.res{box-shadow:inset 0 -3px 0 var(--green)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,93,108,.0)}50%{box-shadow:0 0 0 4px rgba(255,93,108,.35)}}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--dim);margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .timeline{display:flex;gap:3px;align-items:flex-end;height:46px;margin-top:4px}
  .tick{flex:1;background:#232a38;border-radius:3px 3px 0 0;position:relative;min-height:3px;transition:all .3s}
  .tick.past{background:#36405a} .tick.cur{background:var(--blue)}
  .tick .dot{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--red)}
  .tl-labels{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;margin-top:3px}
  .feed{overflow:hidden;flex:1;display:flex;flex-direction:column;gap:5px}
  .ev{display:grid;grid-template-columns:44px 48px 108px 1fr;gap:8px;font-size:12.5px;align-items:start;padding:4px 6px;border-radius:7px}
  .ev .t{color:var(--dim);font-variant-numeric:tabular-nums} .ev .p{font-weight:650}
  .ev .ty{font-size:11px;color:var(--amber)} .ev.routine{opacity:.55} .ev .ty.h{color:var(--red)}
  .ops{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .op{font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid}
  .op.remember{color:var(--green);border-color:#1f5e44} .op.link{color:var(--blue);border-color:#264a86}
  .op.resolve{color:var(--teal);border-color:#1d5c60} .op.supersede{color:var(--amber);border-color:#5b4a1d}
  .alert{border:1px solid #7a2a33;background:linear-gradient(180deg,#22121a,#16121a);border-radius:14px;padding:12px 14px}
  .alert .top{display:flex;gap:8px;align-items:center;font-size:12px;color:#ffb3bc;text-transform:uppercase;letter-spacing:1px;font-weight:650}
  .alert .txt{font-size:14.5px;margin:6px 0 8px;line-height:1.5}
  .rcpt{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:3px}
  .rcpt .r{display:flex;gap:8px} .rcpt .r b{color:var(--blue);font-weight:650;min-width:38px}
  .checks{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .chk{font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid #1f5e44;color:var(--green)}
  .chk.no{border-color:#6a2730;color:var(--red)} .chk.cloud{border-color:#3e3470;color:var(--violet)}
  .sup{border:1px solid #1d5c60;background:#0f1d1f;border-radius:14px;padding:10px 14px;font-size:13.5px}
  .sup .top{font-size:11px;color:var(--teal);text-transform:uppercase;letter-spacing:1px;font-weight:650;margin-bottom:4px}
  .esc{border:1px solid #3e3470;background:#15122a;border-radius:14px;padding:10px 14px;font-size:13px}
  .esc .top{font-size:11px;color:var(--violet);text-transform:uppercase;letter-spacing:1px;font-weight:650;margin-bottom:4px}
  .ledger{overflow:hidden;flex:1;display:flex;flex-direction:column;gap:6px}
  .mem{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--panel2);font-size:12.5px;transition:all .4s}
  .mem .h{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--dim)}
  .mem .id{color:var(--blue);font-weight:700} .mem .seen{margin-left:auto;color:var(--violet);font-weight:650}
  .pill{border-radius:999px;padding:0 7px;font-size:10.5px;border:1px solid}
  .pill.open{color:var(--violet);border-color:#3e3470} .pill.resolved{color:var(--teal);border-color:#1d5c60}
  .pill.superseded{color:var(--amber);border-color:#5b4a1d}
  .mem.superseded .tx{text-decoration:line-through;color:var(--dim)} .mem.fresh{border-color:var(--blue)}
  .foot{font-size:11px;color:var(--dim)}
  .caption{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(8,10,15,.94);border:1px solid #2c3346;color:#fff;
    padding:12px 22px;border-radius:14px;font-size:20px;font-weight:650;max-width:82%;text-align:center;display:none;box-shadow:0 10px 30px rgba(0,0,0,.55);z-index:9}
  .caption small{display:block;font-size:14px;color:var(--dim);font-weight:500;margin-top:3px}
  .hidden{display:none!important}
  #focus{position:fixed;inset:0;background:rgba(6,8,12,.86);display:none;align-items:center;justify-content:center;z-index:8}
  #focus .inner{width:min(1080px,86vw);transform:scale(1.0)}
  #focus .alert,#focus .esc,#focus .mem{font-size:18px} #focus .alert .txt{font-size:22px;line-height:1.5} #focus .rcpt{font-size:16px} #focus .chk{font-size:15px}
  #focus .alert .top,#focus .esc .top{font-size:15px} #focus h3{margin:0 0 10px;font-size:15px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase}
</style>
</head>
<body>
<header>
  <div class="logo">F</div>
  <div><h1>Forget Fleet</h1><div class="sub">Weeks-long memory for an always-on Muse Glimmer agent watching 39 smart-parking poles</div></div>
  <div class="badges" id="badges"></div>
</header>
<main>
  <section class="col">
    <div class="card">
      <div class="dayhead"><div class="d" id="dayd"></div><div class="n" id="dayn"></div></div>
      <div class="map" id="map"></div>
      <div class="legend"><span><i style="background:#2a2412;border:1px solid #5b4a1d"></i>event today</span><span><i style="background:#1a1f2a;box-shadow:inset 0 -3px 0 var(--violet)"></i>open memory</span><span><i style="background:#3a1419;border:1px solid #a53441"></i>recurring-failure alert</span><span><i style="background:#1a1f2a;box-shadow:inset 0 -3px 0 var(--green)"></i>resolved</span></div>
    </div>
    <div class="card">
      <h2>Four weeks of real operations, replayed <span style="margin-left:auto;text-transform:none;letter-spacing:0" id="tlstat"></span></h2>
      <div class="timeline" id="tl"></div>
      <div class="tl-labels"><span id="tl0"></span><span id="tl1"></span></div>
    </div>
    <div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column">
      <h2>Today's events → what Glimmer decided to remember</h2>
      <div class="feed" id="feed"></div>
    </div>
  </section>
  <section class="col">
    <div id="alertbox"></div>
    <div id="supbox"></div>
    <div id="escbox"></div>
    <div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column">
      <h2>Memory ledger <span style="margin-left:auto;text-transform:none;letter-spacing:0" id="memstat"></span></h2>
      <div class="ledger" id="ledger"></div>
    </div>
    <div class="foot" id="foot"></div>
  </section>
</main>
<div id="focus"><div class="inner" id="focusinner"></div></div>
<div class="caption" id="caption"></div>
<script src="trace.js"></script>
<script>
const T = window.TRACE, EV = Object.fromEntries(T.stream.map(e => [e.id, e]));
const $ = s => document.querySelector(s), esc = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const HEALTH = new Set(["reboot","offline","power","network","thermal","telemetry_gap","false_occupancy"]);
const POLES = Array.from({length:39}, (_, i) => `P-${String(i+1).padStart(2,"0")}`);
const fmt = d => new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",weekday:"short"});
function cite(s){ return esc(s).replace(/\[(e\d+)\]/g,'<b style="color:var(--blue)">[$1]</b>').replace(/\[(m\d+)\]/g,'<b style="color:var(--violet)">[$1]</b>'); }
function show(i, opts={}){
  i = Math.max(0, Math.min(T.days.length-1, i)); window.__i = i;
  const D = T.days[i], led = D.ledger, day = D.day;
  $("#dayd").textContent = fmt(day); $("#dayn").textContent = `Day ${i+1} of ${T.days.length} · ${D.events.length} events today`;
  // map
  const todayP = new Set(D.events.map(x => EV[x].pole));
  const openP = {}, resP = new Set(), alertP = new Set(D.alerts.map(a => a.pole));
  led.forEach(m => { if (m.status==="open") openP[m.pole] = (openP[m.pole]||0) + m.events.length; if (m.status==="resolved") resP.add(m.pole); });
  const tile = p => `<div class="tile ${todayP.has(p)?"tev":""} ${openP[p]?"mem":""} ${resP.has(p)&&!openP[p]?"res":""} ${alertP.has(p)?"alert":""}">${p.slice(2)}${openP[p]?`<span class="c">${openP[p]}</span>`:""}</div>`;
  $("#map").innerHTML = POLES.slice(0,23).map(tile).join("") + `<div class="row2">${POLES.slice(23).map(tile).join("")}</div>`;
  // timeline
  const mx = Math.max(...T.days.map(d => d.events.length));
  $("#tl").innerHTML = T.days.map((d, k) => `<div class="tick ${k<i?"past":""} ${k===i?"cur":""}" style="height:${6+40*d.events.length/mx}px">${d.alerts.length&&k<=i?'<span class="dot"></span>':""}</div>`).join("");
  $("#tl0").textContent = fmt(T.days[0].day); $("#tl1").textContent = fmt(T.days[T.days.length-1].day);
  const evSoFar = T.days.slice(0,i+1).reduce((a,d)=>a+d.events.length,0);
  $("#tlstat").textContent = `${evSoFar} events seen · ${led.length} memories kept`;
  // feed
  const opsByEv = {}; D.ops.forEach(o => (o.events||[]).forEach(x => (opsByEv[x] = opsByEv[x] || []).push(o)));
  const evs = D.events.map(x => EV[x]).sort((a,b) => (a.type==="digest") - (b.type==="digest") || a.ts.localeCompare(b.ts));
  $("#feed").innerHTML = evs.slice(0, opts.feedMax || 9).map(e => {
    const os = opsByEv[e.id] || [];
    return `<div class="ev ${os.length?"":"routine"}"><span class="t">${e.ts.slice(11,16)}</span><span class="p">${e.pole==="fleet"?"fleet":e.pole}</span>
      <span class="ty ${HEALTH.has(e.type)?"h":""}">${e.type.replace("_"," ")}</span><span>${esc(e.summary)}
      ${os.length?`<div class="ops">${os.map(o => `<span class="op ${o.op}">${{remember:"+ remember",link:"↻ link to",resolve:"✓ resolve",supersede:"⇄ supersede"}[o.op]||o.op} ${o.op==="link"||o.op==="resolve"||o.op==="supersede"?(o.target||o.id):o.id}</span>`).join("")}</div>`:""}</span></div>`;
  }).join("") + (evs.length > (opts.feedMax||9) ? `<div class="foot">+ ${evs.length-(opts.feedMax||9)} more events</div>` : "");
  // alerts: Glimmer proposes, Muse Spark must agree before a human is paged
  const ALS = [...D.alerts].sort((a,b) => (!!(b.verify&&b.verify.supported)) - (!!(a.verify&&a.verify.supported)));
  const card = al => {
    const ok = al.verify && al.verify.supported, held = al.verify && al.verify.supported === false;
    return `<div class="alert" style="${held?'border-color:#5b4a1d;background:linear-gradient(180deg,#1f1a10,#16140f)':''}">
    <div class="top" style="${held?'color:var(--amber)':''}">${ok?'● Paged on-call':held?'■ Held · not paged':'● Alert'} · recurring failure · ${al.pole} · ${al.occurrence_days.length} days</div>
    <div class="txt">${cite(al.text)}</div>
    <div class="rcpt">${al.receipt.map(x => EV[x]).map(e => `<div class="r"><b>${e.id}</b><span>${e.ts}</span><span>${e.type.replace("_"," ")}</span><span>${esc(e.summary).slice(0,70)}</span></div>`).join("")}</div>
    <div class="checks"><span class="chk ${al.receipt_check?"":"no"}">${al.receipt_check?"✓":"✗"} receipt check: cited events exist, same pole</span>
    ${al.verify && al.verify.by && al.verify.by.startsWith("muse") ? `<span class="chk cloud ${ok?"":"no"}">${ok?"✓ verified by":"✗ rejected by"} ${al.verify.by}</span>`:""}</div>
    ${held && al.verify.problems && al.verify.problems.length ? `<div class="foot" style="margin-top:6px;color:#e8c98a">Why held: ${esc(al.verify.problems[0]).slice(0,190)}</div>` : ""}</div>`;
  };
  $("#alertbox").innerHTML = ALS.length ? card(ALS[0]) + (ALS.length > 1 ? `<div class="foot" style="margin-top:4px">+ ${ALS.length-1} more alert(s) today</div>` : "") : "";
  const SP = (D.suppressed || []);
  $("#supbox").innerHTML = SP.length ? `<div class="sup"><div class="top">✓ Page suppressed · checked memory first</div>${SP.map(x => {
      const m = led.find(mm => mm.id === x.by) || {text: ""};
      return `<div><b>${x.pole}</b>: failures on ${x.occurrence_days.length} days look recurring, but <b style="color:var(--violet)">${x.by}</b> explains them: ${esc(m.text)}</div>`; }).join("")}</div>` : "";
  const E = D.escalation;
  $("#escbox").innerHTML = E && E.text ? `<div class="esc"><div class="top">⇡ Escalated to ${E.by} · ${E.poles.length} poles, same day</div>${cite(E.text)}</div>` : "";
  // ledger
  const fresh = new Set(D.ops.map(o => o.id));
  const show_ = led.filter(m => m.status!=="superseded" || fresh.has(m.id) || fresh.has(m.superseded_by))
    .sort((a,b) => (fresh.has(b.id)-fresh.has(a.id)) || (b.status==="open")-(a.status==="open") || b.events.length-a.events.length || b.last.localeCompare(a.last));
  $("#ledger").innerHTML = show_.slice(0, opts.ledgerMax || 8).map(m => `<div class="mem ${m.status} ${fresh.has(m.id)?"fresh":""}">
    <div class="h"><span class="id">${m.id}</span><span>${m.pole}</span><span class="pill ${m.status}">${m.status}</span><span>${m.kind}</span>
    ${m.supersedes?`<span>replaces ${m.supersedes}</span>`:""}${m.resolved_by?`<span>fixed by ${m.resolved_by}</span>`:""}
    <span class="seen">seen ${m.events.length}× · since ${m.first.slice(5,10)}</span></div><div class="tx">${esc(m.text)}</div></div>`).join("");
  const nOpen = led.filter(m=>m.status==="open").length;
  $("#memstat").textContent = `${nOpen} open · ${led.filter(m=>m.status==="resolved").length} resolved · ${led.filter(m=>m.status==="superseded").length} superseded`;
  // badges
  const gc = T.days.slice(0,i+1).flatMap(d => d.calls.glimmer), sc = T.days.slice(0,i+1).flatMap(d => d.calls.spark);
  const tps = gc.length ? (gc.reduce((a,c)=>a+c.gen_tps,0)/gc.length).toFixed(1) : "-";
  const cost = sc.reduce((a,c)=>a+(c.cost_usd||0),0);
  $("#badges").innerHTML = `<span class="badge local">brain <b>Muse Glimmer 30B</b> · local on DGX Spark · ${tps} tok/s · ${gc.length} calls · $0</span>
    <span class="badge cloud">verify &amp; escalate <b>Muse Spark 1.3</b> · ${sc.length} calls · $${cost.toFixed(3)}</span>`;
  $("#foot").textContent = `Recorded live run · real events from a 39-pole smart-parking deployment in Korea (Oct 9 - Nov 4, anonymised: no images, no plates, no names).`;
}
function caption(t, sub){ const c=$("#caption"); if(!t){c.style.display="none";return;} c.innerHTML = esc(t)+(sub?`<small>${esc(sub)}</small>`:""); c.style.display="block"; }
function focusOn(what){
  const f = $("#focus");
  if (!what){ f.style.display = "none"; return; }
  let html = "";
  if (what === "alert") html = $("#alertbox").innerHTML;
  else if (what === "sup") html = $("#supbox").innerHTML;
  else if (what === "esc") html = $("#escbox").innerHTML;
  else if (what.startsWith("pole:")) {
    const P = what.slice(5), led = T.days[window.__i].ledger.filter(m => m.pole === P || (m.pole === "fleet" && /remov|construct/i.test(m.text)));
    html = `<h3>What the agent remembers about ${P}</h3>` + led.map(m => `<div class="mem ${m.status}" style="margin-bottom:8px"><div class="h"><span class="id">${m.id}</span><span>${m.pole}</span><span class="pill ${m.status}">${m.status}</span><span class="seen">seen ${m.events.length}× · since ${m.first.slice(5,10)}</span></div><div class="tx">${esc(m.text)}</div><div class="h" style="margin-top:4px">receipt: ${m.events.map(x => `${x} (${EV[x].ts.slice(5,16)} ${EV[x].type.replace("_"," ")})`).join(" · ")}</div></div>`).join("");
  }
  $("#focusinner").innerHTML = html; f.style.display = html ? "flex" : "none";
}
window.show = show; window.caption = caption; window.focusOn = focusOn;
const q = new URLSearchParams(location.search);
show(q.has("day") ? +q.get("day") : T.days.length-1);
document.addEventListener("keydown", e => { if (e.key==="ArrowRight") show(window.__i+1); if (e.key==="ArrowLeft") show(window.__i-1); });
</script>
</body>
</html>
